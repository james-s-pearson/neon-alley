# Publishes a GitHub release when a version tag (for example 1.0.0) is
# pushed. Obsidian installs the theme from that release.
#
# Supply chain: the only outside action is GitHub's own checkout, pinned
# to a full commit hash; the release is made with the gh tool that GitHub
# provides on its runners.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches manifest.json
        run: |
          version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Check theme.css is built from the source
        run: |
          ./build.sh
          git diff --exit-code theme.css

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" manifest.json theme.css \
            --title "Neon Alley $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what changed."
